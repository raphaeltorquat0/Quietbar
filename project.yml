name: Quietbar
options:
  bundleIdPrefix: io.github.raphaeltorquat0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  QuietbarKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Quietbar:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: QuietbarKit
        product: MDRSession
      - package: QuietbarKit
        product: MDRTransport
      - package: QuietbarKit
        product: MDRKit
      - package: QuietbarKit
        product: HeadphoneModel
      - target: QuietbarControls
      - sdk: IOBluetooth.framework
      - sdk: CoreWLAN.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raphaeltorquat0.Quietbar
        PRODUCT_NAME: Quietbar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Support/Info.plist
        # scripts/build-app.sh troca para a variante com sandbox; a extensão não é afetada.
        QUIETBAR_APP_ENTITLEMENTS: App/Support/Quietbar.entitlements
        CODE_SIGN_ENTITLEMENTS: $(QUIETBAR_APP_ENTITLEMENTS)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
  QuietbarControls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Controls
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raphaeltorquat0.Quietbar.Controls
        PRODUCT_NAME: QuietbarControls
        INFOPLIST_FILE: Controls/Info.plist
        CODE_SIGN_ENTITLEMENTS: Controls/QuietbarControls.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
