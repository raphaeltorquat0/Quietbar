name: SonyCtl
options:
  bundleIdPrefix: io.github.sonyctl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  SonyCtlKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SonyCtl:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SonyCtlKit
        product: MDRSession
      - package: SonyCtlKit
        product: MDRTransport
      - package: SonyCtlKit
        product: MDRKit
      - package: SonyCtlKit
        product: HeadphoneModel
      - target: SonyCtlControls
      - sdk: IOBluetooth.framework
      - sdk: CoreWLAN.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sonyctl.SonyCtl
        PRODUCT_NAME: SonyCtl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Support/Info.plist
        # scripts/build-app.sh troca para a variante com sandbox; a extensão não é afetada.
        SONYCTL_APP_ENTITLEMENTS: App/Support/SonyCtl.entitlements
        CODE_SIGN_ENTITLEMENTS: $(SONYCTL_APP_ENTITLEMENTS)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
  SonyCtlControls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Controls
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sonyctl.SonyCtl.Controls
        PRODUCT_NAME: SonyCtlControls
        INFOPLIST_FILE: Controls/Info.plist
        CODE_SIGN_ENTITLEMENTS: Controls/SonyCtlControls.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
